# Post a day-of notice from a phone: Actions tab -> "Post bike bus notice" -> Run workflow.
# Writes a valid status.json (date filled in automatically) and commits it; the push
# triggers the normal GitHub Pages deploy.
# See STATUS-HOWTO.md.
name: Post bike bus notice

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Type of notice"
        type: choice
        required: true
        default: cancelled
        options:
          - cancelled
          - changed
          - info
          - clear
      message:
        description: "Message (e.g. No bike bus today because of rain. See you tomorrow.) Leave empty for clear."
        type: string
        required: false
      day:
        description: "Which day it's for"
        type: choice
        required: true
        default: today
        options:
          - today
          - tomorrow
      route:
        description: "Route"
        type: choice
        required: true
        default: sle
        options:
          - sle

permissions:
  contents: write

concurrency:
  group: post-status
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write status.json
        env:
          LEVEL: ${{ inputs.level }}
          MESSAGE: ${{ inputs.message }}
          DAY: ${{ inputs.day }}
          ROUTE: ${{ inputs.route }}
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime, zoneinfo
          level, day, route = os.environ["LEVEL"], os.environ["DAY"], os.environ["ROUTE"]
          message = " ".join(os.environ.get("MESSAGE", "").split())
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/Los_Angeles")).date()
          date = today + datetime.timedelta(days=1 if day == "tomorrow" else 0)

          try:
              with open("status.json") as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  raise ValueError("not an object")
          except Exception as e:
              print(f"status.json was unreadable ({e}); starting fresh")
              data = {}

          if level == "clear":
              # A past date hides the banner; the site never shows stale entries.
              data[route] = {"date": "2000-01-01", "level": "info", "message": "Cleared."}
              print(f"Cleared the {route} notice")
          else:
              if not message:
                  sys.exit("::error::Please type a message (or choose 'clear').")
              if len(message) > 280:
                  sys.exit("::error::Message is too long; keep it under 280 characters.")
              data[route] = {"date": date.isoformat(), "level": level, "message": message}
              print(f"{route}: {level} on {date}: {message}")

          with open("status.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          cat status.json

      - name: Commit
        env:
          LEVEL: ${{ inputs.level }}
          DAY: ${{ inputs.day }}
        run: |
          if git diff --quiet status.json; then
            echo "No change to status.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Notice: $LEVEL ($DAY)" -- status.json
          git push
